name: Build Flutter APK

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Backup pubspec.yaml
        run: cp pubspec.yaml pubspec.yaml.bak

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.x"
          channel: "stable"

      - name: Generate Android Project
        run: |
          flutter create . \
            --project-name fog_safety_app \
            --platforms=android \
            --org com.inspire.fogsafety

      - name: Set Minimum Android SDK
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
      - name: Restore pubspec.yaml
        run: cp pubspec.yaml.bak pubspec.yaml

      - name: Add Location Permissions
        run: |
          sed -i '/<manifest/a\
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' \
          android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inspire-fog-safety-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
