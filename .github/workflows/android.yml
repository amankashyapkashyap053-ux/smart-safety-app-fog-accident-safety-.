name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Re-create Complete Flutter Project Structure
        run: |
          mkdir temp_app
          cp pubspec.yaml temp_app/
          cp -r lib temp_app/
          cd temp_app
          flutter create . --platforms=android --org com.inspire.fogsafety

      - name: Install Dependencies
        run: |
          cd temp_app
          flutter pub get

      - name: Build APK
        run: |
          cd temp_app
          flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inspire-fog-safety-apk
          path: temp_app/build/app/outputs/flutter-apk/app-debug.apk
          
